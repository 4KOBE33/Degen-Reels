<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Degen Reels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>

  <!-- The Hub: between raids -->
  <div id="hub">
    <header class="hubhead">
      <h1 class="logo small">DEGEN<br>REELS</h1>
      <div id="hubWallet" class="walletbar"></div>
    </header>
    <nav id="hubTabs" class="tabs">
      <button data-tab="loadout">🎒 Loadout</button>
      <button data-tab="backroom">🎰 Back Room</button>
      <button data-tab="fence">💰 Fence</button>
      <button data-tab="look">🎨 Look</button>
      <button data-tab="records">🏆 Records</button>
      <button data-tab="settings">⚙️ Settings</button>
    </nav>
    <main id="hubBody" class="hubbody"></main>
    <footer class="hubfoot">
      <button id="deploy" class="btn big">DEPLOY</button>
    </footer>
    <div id="hubToast"></div>
    <div id="loading" hidden>Loading map…</div>
  </div>

  <!-- Raid HUD -->
  <div id="hud" hidden>
    <div id="topleft" class="panel">
      <div id="timer"></div>
      <div id="zone"></div>
      <div id="exits"></div>
    </div>
    <canvas id="minimap" width="180" height="180"></canvas>
    <div id="feed"></div>
    <div id="bossbar" hidden><span>👑 THE PIT BOSS</span><div class="bar"><div id="bossFill"></div></div></div>

    <div id="vitals" class="panel">
      <div id="hpText"></div>
      <div class="bar hp"><div id="hpFill"></div></div>
      <div class="bar armor"><div id="armorFill"></div></div>
      <div class="bar stamina"><div id="staminaFill"></div></div>
      <div id="warmRow" class="warmrow" hidden><span id="warmIcon">🔥</span><div class="bar warmth"><div id="warmFill"></div></div></div>
      <div class="row2"><span id="raidChips"></span><span id="quick"></span></div>
    </div>
    <div id="weapons" class="panel"></div>
    <div id="packbar" class="panel"></div>

    <div id="crosshair"><i></i><i></i><i></i><i></i></div>
    <div id="hitmarker">✕</div>
    <div id="prompt" hidden></div>
    <div id="progress" hidden><div id="progressLabel"></div><div class="bar"><div id="progressFill"></div></div></div>
    <div id="toast"></div>
    <div id="extracting" hidden></div>
    <div id="vignette"></div>
    <div id="frost"></div>
    <div id="intro"></div>
    <div id="keyhint">Q backpack · M map · V camera · H heal · F armor · R reload · Right click aim</div>
  </div>

  <div id="bag" hidden>
    <div class="inv">
      <header class="invhead">
        <h2>BACKPACK</h2>
        <div id="invHaul" class="invhaul"></div>
        <button class="btn" data-close>Back to the raid <kbd>Q</kbd></button>
      </header>
      <div id="bagList" class="invbody"></div>
    </div>
  </div>

  <div id="bigmap" class="screen dim" hidden>
    <div class="card wide">
      <h2 id="bigmapTitle">MAP</h2>
      <canvas id="bigmapCanvas" width="800" height="800"></canvas>
      <div class="legend"><span><i class="lg exit"></i>Open exit</span><span><i class="lg closed"></i>Closed exit</span><span>▲ You</span><span>👑 Pit Boss</span><span><i class="lg deadly"></i>Deadly zone</span></div>
      <button class="btn" data-close>Back to the raid</button>
    </div>
  </div>

  <div id="flashbang"></div>
  <div id="killcam" hidden></div>
  <div id="downed" hidden></div>
  <div id="twheel" hidden></div>
  <div id="crash" class="screen dim" hidden>
    <div class="card">
      <h2>💥 <span id="crashWhat">Something broke</span></h2>
      <p>Your stash and progress are saved. Reload to jump back in.</p>
      <p class="hint" id="crashDetail"></p>
      <button id="crashReload" class="btn big">RELOAD</button>
      <button id="crashDismiss" class="btn ghost">Try to keep playing</button>
    </div>
  </div>

  <div id="paused" class="screen dim" hidden>
    <div class="card">
      <h2>PAUSED</h2>
      <p class="keys" id="pauseKeys"></p>
      <div class="pauseBtns"><button id="openBag" class="btn">🎒 Open backpack</button><button id="povBtn" class="btn"></button><button id="openBinds" class="btn">⌨️ Controls</button></div>
      <div id="pauseBinds" hidden></div>
      <label class="slider">Mouse sensitivity <b id="psensVal"></b><input type="range" id="psens" min="0.1" max="3" step="0.05"></label>
      <label class="slider">Field of view <b id="pfovVal"></b><input type="range" id="pfov" min="60" max="100" step="1"></label>
      <label class="slider">Volume <b id="pvolVal"></b><input type="range" id="pvol" min="0" max="1" step="0.05"></label>
      <button id="resume" class="btn big">RESUME</button>
      <button id="abandon" class="btn ghost">Abandon raid (lose everything)</button>
    </div>
  </div>

  <div id="results" class="screen dim" hidden>
    <div class="card wide">
      <h2 id="resultsTitle"></h2>
      <p id="resultsLine"></p>
      <div id="resultsItems" class="chips"></div>
      <p id="resultsUnlocks" class="unlocks"></p>
      <button id="resultsBack" class="btn big">BACK TO THE HUB</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
